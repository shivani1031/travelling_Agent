services:
  db:
    image: postgres:16-alpine
    container_name: traveller_agent_db
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: travel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
